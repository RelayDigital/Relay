name: Relay contact form security tests
on:
  pull_request:
    paths:
      - "relay-headless/src/app/api/contact/**"
      - "relay-headless/tests/contact-core.test.mjs"
      - ".github/workflows/relay-contact-security.yml"
  push:
    paths:
      - "relay-headless/src/app/api/contact/**"
      - "relay-headless/tests/contact-core.test.mjs"
      - ".github/workflows/relay-contact-security.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test relay-headless/tests/contact-core.test.mjs
